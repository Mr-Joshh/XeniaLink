# XeniaLink config. Copy to Hdd:\XeniaLink.ini on the console.

[Live]
# Xenia Web Services. https:// uses the plugin's built-in TLS (BearSSL), no PC needed:
api_address = https://xenia-netplay-2a0298c0e3f4.herokuapp.com/

# Port advertised to other players. Xenia always uses 36000; leave it unless you
# know you need something else.
player_port = 36000

# Set this to skip the /whoami lookup (leave empty normally).
public_ip_override =

# Report local profiles as signed in to Live with Gold while a game runs.
spoof_signin = true

# Refuse DNS lookups for xboxlive.com / xbox.com from games (ban safety).
block_xbox_live = true

# Titles that are never hooked (hex title IDs, comma separated).
exclude_titles = FFFE07D1,FFFF0055,F5D20000,C0DE9999,00000166

log_path = Hdd:\XeniaLink.log

# Extra diagnostic log lines: game sockets and packets, HTTP timings, TLS, XGI/XHttp
# details, thread-naming exceptions. Errors are always logged. Leave off for normal play.
debug_log = false

[XHttp]
# Games that talk to their own web backend through XHttp (Star Wars: First
# Assault) get it from the plugin, since the console's real XHttp needs Live.
xhttp_emulate = true
# Requests the game sends to 127.0.0.1 / localhost go here instead
# (same as xhttp_host in the Xenia First Assault build).
xhttp_host = 74.91.124.65
# Tell the game "Xbox Live connected" after it starts XAuth, like Xenia does.
inject_live_notify = true
